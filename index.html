<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Jinyi Luan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,900;1,9..144,500&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html, body{ height:100%; overflow:hidden; }
  body{ display:flex; flex-direction:column; }
  .nav{
    position:fixed; top:0; left:0; right:0; z-index:50;
    background:transparent; border:none; box-shadow:none;
    color:#fff;
    padding-top:1.1rem; padding-bottom:1.1rem;
  }
  .wordmark-sm{ color:#fff; }
  .nav-links .pill{ color:#fff; }
  .nav-links .pill:hover, .nav-links .pill.is-active{ color:#fff; }
  .hero{
    position:relative;
    flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; justify-content:flex-end;
    overflow:hidden;
    padding:clamp(1.5rem,4vw,3rem);
    isolation:isolate;
    background:var(--black);
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background:url("assets/41f167302088ef900110d7dd9ac0e53d.jpg") center 30% / cover no-repeat;
    z-index:0;
  }
  .tint{
    position:absolute; inset:0; z-index:1;
    background:rgba(0,0,0,0.45);
    pointer-events:none;
  }

  .hero-index{
    position:absolute; z-index:3;
    top:50%; left:clamp(1.5rem,4vw,3rem); right:clamp(1.5rem,4vw,3rem);
    transform:translateY(-50%);
    display:flex; flex-wrap:wrap;
    justify-content:space-between;
    gap:2rem clamp(1.5rem,4vw,3.5rem);
  }
  .index-card{
    display:block; text-decoration:none; color:var(--ink-on-black);
    flex:1 1 200px; max-width:340px;
  }
  .index-num{
    display:block;
    font-family:var(--mono); font-size:0.78rem;
    letter-spacing:0.06em; color:var(--ink-on-black);
    margin-bottom:0.5rem;
    text-shadow:0 0 3px rgba(255,255,255,0.95), 0 0 9px rgba(255,255,255,0.8), 0 0 20px rgba(255,255,255,0.5);
    transition:text-shadow .15s ease;
  }
  .index-rule{
    display:block; height:1.5px; width:100%;
    background:#fff; opacity:0.9;
    margin-bottom:0.9rem;
    box-shadow:0 0 3px rgba(255,255,255,0.9), 0 0 10px rgba(255,255,255,0.6);
    transition:box-shadow .15s ease, opacity .15s ease;
  }
  .index-title{
    display:flex; align-items:baseline; gap:0.55rem;
    font-family:var(--display); font-weight:500; font-style:normal;
    font-size:clamp(1.4rem,2.6vw,2.1rem); line-height:1.15;
    text-shadow:0 0 3px rgba(255,255,255,0.95), 0 0 11px rgba(255,255,255,0.85),
      0 0 28px rgba(255,255,255,0.6), 0 0 55px rgba(255,255,255,0.35);
    transition:text-shadow .15s ease;
  }
  .index-title .arrow{ font-size:0.65em; }
  .index-card:hover .index-title, .index-card:focus-visible .index-title{
    text-shadow:0 0 4px #fff, 0 0 14px rgba(255,255,255,0.95),
      0 0 35px rgba(255,255,255,0.75), 0 0 70px rgba(255,255,255,0.45);
  }
  .index-card:hover .index-num, .index-card:focus-visible .index-num{
    text-shadow:0 0 4px #fff, 0 0 12px #fff, 0 0 28px rgba(255,255,255,0.7);
  }
  .index-card:hover .index-rule, .index-card:focus-visible .index-rule{
    box-shadow:0 0 4px #fff, 0 0 12px #fff, 0 0 28px rgba(255,255,255,0.7);
  }

  .index-card:active .index-title{ animation:glow-flash .4s ease-out; }
  .index-card:active .index-num{
    text-shadow:0 0 5px #fff, 0 0 17px #fff, 0 0 40px rgba(255,255,255,0.9);
  }
  .index-card:active .index-rule{
    box-shadow:0 0 6px #fff, 0 0 18px #fff, 0 0 40px rgba(255,255,255,0.9);
  }
  @keyframes glow-flash{
    0%{ text-shadow:0 0 8px #fff, 0 0 30px #fff, 0 0 65px rgba(255,255,255,1), 0 0 120px rgba(255,255,255,0.75); }
    100%{ text-shadow:0 0 4px #fff, 0 0 14px rgba(255,255,255,0.95), 0 0 35px rgba(255,255,255,0.75), 0 0 70px rgba(255,255,255,0.45); }
  }
  @media (prefers-reduced-motion: reduce){
    .index-card:active .index-title{ animation:none; }
  }

  .hero-bottom{
    position:relative; z-index:3;
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:1rem; flex-wrap:wrap;
  }
  .tag-line{
    font-family:var(--mono); font-size:0.72rem;
    letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ink-on-black);
  }

  @media (max-width: 720px){
    .hero-index{ gap:1.5rem 2rem; }
  }
</style>
</head>
<body>
<header class="nav">
  <a class="wordmark-sm" href="./">Jinyi Luan</a>
  <nav class="nav-links">
    <a class="pill" href="#">About</a>
    <a class="pill" href="#">Contact</a>
  </nav>
</header>

<section class="hero" id="top">
  <div class="tint" aria-hidden="true"></div>

  <nav class="hero-index" aria-label="Sections">
    <a class="index-card" href="works.html">
      <span class="index-num">01</span>
      <span class="index-rule"></span>
      <span class="index-title">Artworks <span class="arrow">↗</span></span>
    </a>
    <a class="index-card" href="inspiration.html">
      <span class="index-num">02</span>
      <span class="index-rule"></span>
      <span class="index-title">Inspirations<br>+ Experiments <span class="arrow">↗</span></span>
    </a>
    <a class="index-card" href="design.html">
      <span class="index-num">03</span>
      <span class="index-rule"></span>
      <span class="index-title">Design Works <span class="arrow">↗</span></span>
    </a>
  </nav>

  <div class="hero-bottom">
    <span class="tag-line">Art · Design · Experiment</span>
    <span class="tag-line">London, UK</span>
  </div>
</section>

</body>
</html>
